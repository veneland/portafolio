3</text><rect x="32" y="460" width="210" height="64" rx="19"/><text x="48" y="487" class="bp-title">¿Cuenta y tipo</text><text x="48" y="508" class="bp-sub">de evento?</text></g><g class="bp-node bp-output" data-node="TG1" data-description="Grupo principal: recibe eventos, resumen diario, reporte semanal y heartbeat."><text x="32" y="618" class="bp-index">04</text><rect x="32" y="630" width="210" height="64" rx="19"/><text x="48" y="657" class="bp-title">Telegram</text><text x="48" y="678" class="bp-sub">hilo por cuenta</text></g><g class="bp-node bp-output" data-node="TG2" data-description="Grupo HUB: recibe los eventos en el hilo de cada cuenta."><text x="32" y="778" class="bp-index">04</text><rect x="32" y="790" width="210" height="64" rx="19"/><text x="48" y="817" class="bp-title">Telegram</text><text x="48" y="838" class="bp-sub">hilo por cuenta</text></g><g class="bp-node" data-node="CRON" data-description="n8n programa el resumen diario, el reporte semanal y el heartbeat."><text x="318" y="88" class="bp-index">01</text><rect x="318" y="100" width="210" height="64" rx="19"/><text x="334" y="138" class="bp-title">n8n · schedules</text></g><g class="bp-node" data-node="D" data-description="El resumen diario se guarda en PostgreSQL y se publica en el grupo principal."><text x="318" y="218" class="bp-index">02</text><rect x="318" y="230" width="210" height="64" rx="19"/><text x="334" y="268" class="bp-title">Resumen diario</text></g><g class="bp-node" data-node="W" data-description="El reporte semanal se guarda en PostgreSQL y se publica en el grupo principal."><text x="318" y="333" class="bp-index">02</text><rect x="318" y="345" width="210" height="64" rx="19"/><text x="334" y="383" class="bp-title">Reporte semanal</text></g><g class="bp-node" data-node="HB" data-description="El heartbeat se guarda en PostgreSQL y se publica en el grupo principal."><text x="318" y="448" class="bp-index">02</text><rect x="318" y="460" width="210" height="64" rx="19"/><text x="334" y="498" class="bp-title">Heartbeat</text></g><g class="bp-node" data-node="PG" data-description="PostgreSQL recibe eventos, resumen diario, reporte semanal y heartbeat; el dashboard lee la base."><text x="318" y="618" class="bp-index">03</text><rect x="318" y="630" width="210" height="64" rx="19"/><text x="334" y="657" class="bp-title">PostgreSQL</text><text x="334" y="678" class="bp-sub">eventos</text></g><g class="bp-node bp-output" data-node="DASH" data-description="El dashboard lee PostgreSQL con OAuth y 2FA."><text x="318" y="778" class="bp-index">04</text><rect x="318" y="790" width="210" height="64" rx="19"/><text x="334" y="817" class="bp-title">Dashboard Next.js</text><text x="334" y="838" class="bp-sub">OAuth + 2FA</text></g></svg>