<svg xmlns="http://www.w3.org/2000/svg" class="bp-svg bp-desktop bp-dark" viewBox="0 0 600 1100" role="img" aria-labelledby="bp02-desktop-title bp02-desktop-desc"><title id="bp02-desktop-title">MIGRACIÓN DE INFRAESTRUCTURA</title><desc id="bp02-desktop-desc">Diagrama: servidor de origen y de destino; dumps y extracciones con checksum pasan por prueba de restauración; cutover de DNS; auditoría Go/No-Go.</desc><style>.bp-svg { display:block; width:100%; height:auto; overflow:visible; }
.bp-svg text { font-family:Outfit,system-ui,sans-serif; fill:#1A1716; }
.bp-svg .bp-title { font-size:17px; font-weight:500; }
.bp-svg .bp-sub { font-size:16px; font-weight:300; fill:#625C54; }
.bp-svg .bp-index { font-family:Unbounded,system-ui,sans-serif; font-size:16px; font-weight:300; fill:#56634F; }
.bp-svg .bp-kicker { font-size:16px; font-weight:400; fill:#796749; letter-spacing:1px; }
.bp-svg .bp-rule { stroke:#CBC4B9; stroke-width:1; }
.bp-svg .bp-node rect { fill:#FBFAF6; stroke:#CBC4B9; stroke-width:1; }
.bp-svg .bp-output rect { stroke:#796749; }
.bp-svg .bp-route { fill:none; stroke:#6B665E; stroke-width:1.5; }
.bp-svg .bp-label { font-size:16px; fill:#796749; paint-order:stroke; stroke:#FBFAF6; stroke-width:7px; stroke-linejoin:round; }


.bp-svg .bp-human rect { fill:#A7B3A2; stroke:#56634F; }
.bp-svg .bp-human text { fill:#1A1716; }
.bp-svg .bp-zone { fill:none; stroke:#AAA294; stroke-width:1; stroke-dasharray:4 5; }
.bp-svg .bp-zone-label { font:400 16px Outfit,system-ui,sans-serif; fill:#625C54; paint-order:stroke; stroke:#FBFAF6; stroke-width:5; }
.bp-svg .bp-dashed .bp-route { stroke-dasharray:4 5; }
.bp-svg.bp-dark text { fill:#F2EEE7; }
.bp-svg.bp-dark .bp-sub { fill:#BDB7AD; }
.bp-svg.bp-dark .bp-index { fill:#A7B3A2; }
.bp-svg.bp-dark .bp-kicker { fill:#D8C9B1; }
.bp-svg.bp-dark .bp-rule { stroke:#3A3532; }
.bp-svg.bp-dark .bp-node rect { fill:#1A1716; stroke:#3A3532; }
.bp-svg.bp-dark .bp-output rect { stroke:#D8C9B1; }
.bp-svg.bp-dark .bp-label { fill:#D8C9B1; stroke:#1A1716; }
.bp-svg.bp-dark .bp-zone { stroke:#6B665E; }
.bp-svg.bp-dark .bp-zone-label { fill:#BDB7AD; stroke:#1A1716; }
.bp-svg.bp-dark .bp-human rect { fill:#A7B3A2; stroke:#A7B3A2; }
.bp-svg.bp-dark .bp-human text { fill:#1A1716; }
.bp-svg.bp-dark .bp-human .bp-index { fill:#A7B3A2; }
.bp-svg.bp-dark .bp-node:focus-visible rect, .bp-svg.bp-dark .bp-node.is-active rect { stroke:#A7B3A2; }
.bp-svg.bp-dark .bp-edge.is-active .bp-route { stroke:#D8C9B1; }
